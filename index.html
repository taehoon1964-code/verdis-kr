<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERDIS Platform</title>
  <style>
    body{margin:0;height:100vh;background:#fff;font-family:'Segoe UI','Noto Sans KR',sans-serif;overflow:hidden}

    #splash{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:#fff;
      opacity:0;
      animation:fadeIn .8s ease forwards;
      z-index:1;
      transition:opacity .4s ease;
    }
    #splash img{
      max-width:80%;
      max-height:80%;
      object-fit:contain;
    }
    @keyframes fadeIn{to{opacity:1}}

    #app-frame{
      display:none;
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      border:none;
      z-index:9999;
    }

    #fallback{
      display:none;
      position:fixed;
      left:0;right:0;bottom:10%;
      padding:0 24px;
      text-align:center;
      color:#475569;
      font-size:14px;
      z-index:2;
    }
    #fallback a{
      display:inline-block;
      margin-top:12px;
      padding:14px 28px;
      border-radius:10px;
      background:#2563eb;
      color:#fff;
      font-size:16px;
      font-weight:700;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <!-- 스플래시 (페이드인) -->
  <div id="splash">
    <img src="/splash.png" alt="VERDIS Platform">
  </div>

  <!-- iframe이 뜨지 않을 때 직접 접속 (Safari 쿠키 차단 등) -->
  <div id="fallback">
    <div>화면이 열리지 않으면 아래 버튼을 눌러 주세요.</div>
    <a id="fallback-link">포털 바로 열기</a>
  </div>

  <!-- iframe -->
  <iframe
    id="app-frame"
    src="https://script.google.com/a/macros/interwell.co.kr/s/AKfycbwKMtwPuzjI286q1CAfkHDMVuQIzHg9EvnP3eODy-zOTLllagsN_RR78PObEUW5Zl2kSA/exec"
    allowfullscreen
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    var frame = document.getElementById('app-frame');
    var fallback = document.getElementById('fallback');
    document.getElementById('fallback-link').href = frame.src;
    var fallbackTimer = setTimeout(function(){ fallback.style.display = 'block'; }, 8000);
    frame.addEventListener('load', function(){
      clearTimeout(fallbackTimer);
      fallback.style.display = 'none';
      var splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(function(){ splash.style.display = 'none'; }, 400);
      frame.style.display = 'block';
    });
  </script>

</body>
</html>
