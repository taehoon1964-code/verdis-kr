<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMPAGO · VERION</title>
  <style>
    body{margin:0;height:100vh;background:#fff;font-family:'Segoe UI','Noto Sans KR',sans-serif;overflow:hidden}
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;opacity:0;animation:fadeIn .8s ease forwards;z-index:1;transition:opacity .4s ease}
    #splash .brand{display:flex;flex-direction:column;align-items:center;gap:16px}
    #splash .wordmark .v{font-size:36px;font-weight:800;letter-spacing:1px;color:#0A1F3D;line-height:1}
    #splash .wordmark .c{font-size:15px;font-weight:800;letter-spacing:7px;color:#C79A3A;margin-top:7px;padding-left:7px}
    @keyframes fadeIn{to{opacity:1}}
    #app-frame{display:none;position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999}
  </style>
</head>
<body>
  <div id="splash">
    <div class="brand">
      <svg viewBox="0 0 120 120" width="104" height="104" aria-label="VERION">
        <defs><linearGradient id="vleaf" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#0F6B63"/><stop offset="1" stop-color="#86C79A"/></linearGradient></defs>
        <circle cx="60" cy="63" r="40" fill="none" stroke="#0A1F3D" stroke-width="6.5"/>
        <path d="M40 41 L60 86 L80 41" fill="none" stroke="#0A1F3D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M73 28 C84 19 99 21 102 23 C98 38 85 46 71 43 C71 37 71 32 73 28 Z" fill="url(#vleaf)"/>
        <path d="M75 40 C82 33 92 27 100 24" stroke="#0A1F3D" stroke-width="1.6" fill="none" opacity=".3"/>
      </svg>
      <div class="wordmark">
        <div class="v">VERION</div>
        <div class="c">COMPAGO</div>
      </div>
    </div>
  </div>

  <iframe id="app-frame" allowfullscreen allow="clipboard-read; clipboard-write"></iframe>

  <script>
    var EXEC = "https://script.google.com/macros/s/AKfycbwzdibDFCLrEWKk5D4YA87GPw1SlrOAWWbmzmfGlQv3qC1O_8iCpa5GhdaZYhXAAaWL/exec";
    var frame  = document.getElementById('app-frame');
    var splash = document.getElementById('splash');
    var q = location.search || '';
    frame.src = EXEC + q;
    var isNav = /[?&]view=/.test(q);
    if (isNav) { splash.style.display = 'none'; frame.style.display = 'block'; }
    frame.addEventListener('load', function () {
      splash.style.opacity = '0';
      setTimeout(function () { splash.style.display = 'none'; }, 400);
      frame.style.display = 'block';
    });
    window.addEventListener('message', function (e) {
      try {
        var d = e.data; if (!d) return;
        if (d.compagoHome) { location.href = location.pathname; return; }
        if (d.compagoView !== undefined) {
          var v = String(d.compagoView || '');
          frame.src = EXEC + v + (v.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
