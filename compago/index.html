<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMPAGO · VERION</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:'Segoe UI','Noto Sans KR',sans-serif}
    #frames{position:fixed;inset:0}
    /* 숨긴 화면도 크기를 유지한다(visibility) — display:none 이면 다시 보일 때 레이아웃·차트가 다시 계산된다 */
    #frames iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#fff;visibility:hidden;z-index:1}
    #frames iframe.on{visibility:visible;z-index:2}

    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:10;
      opacity:0;animation:fadeIn .8s ease forwards;transition:opacity .4s ease}
    #loader.hide{opacity:0 !important;animation:none;pointer-events:none}
    #loader.skip{display:none}
    #loader .brand{display:flex;flex-direction:column;align-items:center;gap:16px}
    #loader .wordmark .v{font-size:36px;font-weight:800;letter-spacing:1px;color:#0A1F3D;line-height:1}
    #loader .wordmark .c{font-size:15px;font-weight:800;letter-spacing:7px;color:#C79A3A;margin-top:7px;padding-left:7px}
    @keyframes fadeIn{to{opacity:1}}

    #navspin{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(8,22,34,.28)}
    #navspin.show{display:flex}
    #navspin .sp{width:46px;height:46px;border:4px solid rgba(255,255,255,.35);border-top-color:#12b58a;border-radius:50%;animation:cpSpin .8s linear infinite}
    @keyframes cpSpin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

  <div id="loader">
    <div class="brand">
      <svg viewBox="0 0 120 120" width="104" height="104" aria-label="VERION">
        <defs><linearGradient id="vleaf" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#0F6B63"/><stop offset="1" stop-color="#86C79A"/></linearGradient></defs>
        <circle cx="60" cy="63" r="40" fill="none" stroke="#0A1F3D" stroke-width="6.5"/>
        <path d="M40 41 L60 86 L80 41" fill="none" stroke="#0A1F3D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M73 28 C84 19 99 21 102 23 C98 38 85 46 71 43 C71 37 71 32 73 28 Z" fill="url(#vleaf)"/>
        <path d="M75 40 C82 33 92 27 100 24" stroke="#0A1F3D" stroke-width="1.6" fill="none" opacity=".3"/>
      </svg>
      <div class="wordmark">
        <div class="v">VERION</div>
        <div class="c">COMPAGO</div>
      </div>
    </div>
  </div>
  <div id="navspin" aria-hidden="true"><div class="sp"></div></div>
  <div id="frames"></div>

  <script>
  /* ==========================================================================
   *  COMPAGO keep-alive 셸 (interwell 스탠바이 · verdis.kr/compago)
   *  한 번 연 모듈 화면을 버리지 않고 숨겨 두었다가, 다시 가면 즉시 보여준다.
   *  다시 보일 때 앱이 "그사이 데이터가 바뀌었는지"를 서버에 가볍게 묻고, 바뀌었으면 그 화면만 새로 받는다.
   *  앱이 이 규약을 모르면(기준선 모드·구버전) 예전과 똑같이 동작한다.
   * ========================================================================== */
  (function () {
    var EXEC = "https://script.google.com/macros/s/AKfycbwzdibDFCLrEWKk5D4YA87GPw1SlrOAWWbmzmfGlQv3qC1O_8iCpa5GhdaZYhXAAaWL/exec";
    var SMALL = !!(window.matchMedia && window.matchMedia('(max-width: 820px)').matches);
    var MAX_FRAMES = SMALL ? 3 : 6;          // 동시에 살려 둘 화면 수(메모리 보호)
    var MAX_AGE_MS = 60 * 60 * 1000;         // 1시간 넘은 화면은 새로 받는다(배포 갱신 반영)
    var FIRST_FAILSAFE_MS = 8000, NAV_FAILSAFE_MS = 20000;

    var box = document.getElementById('frames');
    var loader = document.getElementById('loader');
    var navspin = document.getElementById('navspin');
    var recs = [];                            // { key, search, el, win, shell, ready, dirty, born, used }
    var active = null, pending = null, failsafe = 0, firstShown = false;

    // 모듈 이동(?view=)으로 셸을 새로 연 경우엔 스플래시를 생략(반복 번쩍임 방지) — 기존 래퍼와 동일
    if (/[?&]view=/.test(location.search || '')) loader.className = 'skip';

    function cleanSearch(s) {
      s = String(s || '');
      if (s.charAt(0) === '?') s = s.slice(1);
      var parts = s.split('&').filter(function (kv) { return kv && kv.split('=')[0] !== '_'; });
      return parts.length ? '?' + parts.join('&') : '';
    }
    function param(s, name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(s);
      if (!m) return '';
      try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
    }
    function keyOf(s) { var v = param(s, 'view'); return (!v || v.indexOf('cat-') === 0) ? 'home' : v; }
    function homeHash(s) { var v = param(s, 'view'); return (v && v.indexOf('cat-') === 0) ? '#cat/' + v.slice(4) : '#home'; }
    function hasExtras(s) {
      return s.slice(1).split('&').some(function (kv) { var k = kv.split('=')[0]; return kv && k !== 'view' && k !== 'screen'; });
    }
    function reusable(rec, s) {
      if (!rec || !rec.shell || !rec.ready) return false;
      if (Date.now() - rec.born > MAX_AGE_MS) return false;
      if (rec.key === 'home') return true;
      if (rec.search === s) return true;
      return !hasExtras(s) && param(s, 'screen') === param(rec.search, 'screen');
    }

    function setOn(rec) {
      for (var i = 0; i < recs.length; i++) recs[i].el.className = (recs[i] === rec) ? 'on' : '';
      active = rec;
      rec.used = Date.now();
      try { rec.el.contentWindow.focus(); } catch (e) {}
    }
    function post(rec, msg) { try { if (rec && rec.win) rec.win.postMessage(msg, '*'); } catch (e) {} }
    function removeRec(rec) {
      var i = recs.indexOf(rec);
      if (i >= 0) recs.splice(i, 1);
      try { rec.el.parentNode.removeChild(rec.el); } catch (e) {}
      if (active === rec) active = null;
      if (pending === rec) pending = null;
    }
    function evict() {
      while (recs.length >= MAX_FRAMES) {
        var cands = recs.filter(function (r) { return r !== active && r !== pending && !r.dirty; });
        if (!cands.length) break;
        cands.sort(function (a, b) { return a.used - b.used; });
        removeRec(cands[0]);
      }
    }
    function recOfSource(src) {
      for (var i = 0; i < recs.length; i++) {
        var w = src, cw = recs[i].el.contentWindow;
        for (var d = 0; d < 6 && w; d++) {
          if (w === cw) return recs[i];
          var p = null;
          try { p = w.parent; } catch (e) { break; }
          if (!p || p === w) break;
          w = p;
        }
      }
      return null;
    }
    function showSpin() { if (firstShown) navspin.className = 'show'; }
    function hideSpin() { navspin.className = ''; }

    function reveal(rec) {
      if (recs.indexOf(rec) < 0) return;
      if (pending === rec) pending = null;
      clearTimeout(failsafe);
      setOn(rec);
      firstShown = true;
      if (loader.className !== 'skip') loader.className = 'hide';
      hideSpin();
      recs.slice().forEach(function (r) { if (r !== rec && r.key === rec.key) removeRec(r); });
    }
    function startLoad(key, s, opts) {
      if (pending) {
        if (pending.key === key && pending.search === s) return;
        removeRec(pending);
      }
      evict();
      var el = document.createElement('iframe');
      el.setAttribute('allow', 'clipboard-read; clipboard-write');
      el.setAttribute('allowfullscreen', '');
      el.setAttribute('title', 'COMPAGO');
      var rec = { key: key, search: s, el: el, win: null, shell: false, ready: false, dirty: false, born: Date.now(), used: Date.now() };
      recs.push(rec);
      pending = rec;
      el.addEventListener('load', function () {
        setTimeout(function () { if (pending === rec) reveal(rec); }, rec.shell ? 50 : 300);
      });
      el.src = EXEC + (s ? s + '&' : '?') + '_=' + Date.now();
      box.appendChild(el);
      if (firstShown && !(opts && opts.spun)) showSpin();
      clearTimeout(failsafe);
      failsafe = setTimeout(function () { if (pending === rec) reveal(rec); }, firstShown ? NAV_FAILSAFE_MS : FIRST_FAILSAFE_MS);
    }

    function go(search, opts) {
      opts = opts || {};
      var s = cleanSearch(search), key = keyOf(s);
      if (opts.push) { try { history.pushState({ compago: 1 }, '', location.pathname + s); } catch (e) {} }
      var rec = null;
      for (var i = 0; i < recs.length; i++) { if (recs[i].key === key && recs[i] !== pending) { rec = recs[i]; break; } }
      if (rec && reusable(rec, s)) {
        if (pending) { removeRec(pending); clearTimeout(failsafe); }
        setOn(rec);
        hideSpin();
        post(rec, { compago: 'resume', t: opts.t || 0, hash: key === 'home' ? homeHash(s) : null });
        return;
      }
      startLoad(key, s, opts);
    }

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;
      var rec = recOfSource(e.source);
      if (!rec) return;
      if (d.compago == null) {                // 이전 규약 호환
        if (d.compagoView !== undefined) go(String(d.compagoView || ''), { push: true });
        else if (d.compagoNav) go(d.search || '', { push: true });
        else if (d.compagoHome) go('', { push: true });
        return;
      }
      switch (d.compago) {
        case 'hello':
          rec.shell = true; rec.win = e.source;
          post(rec, { compago: 'shell', v: 1 });
          break;
        case 'dom':
          rec.ready = true;
          if (!rec.win) rec.win = e.source;
          if (pending === rec) reveal(rec);
          break;
        case 'nav':
          if (rec === active) { rec.dirty = !!d.dirty; go(d.search || '', { push: true, t: d.t, spun: d.spun }); }
          break;
        case 'reload':
          if (rec === active && !pending) { rec.shell = false; startLoad(rec.key, rec.search, {}); }
          break;
      }
    });
    window.addEventListener('popstate', function () { go(location.search, {}); });
    go(location.search, {});
  })();
  </script>

</body>
</html>
